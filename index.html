<!DOCTYPE html>
<html>
<head>
  <title>Camera Focus Demo - Auto Start</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
  <style>
    #container {
      height: 480px;
      width: 100%;
      background: #333;
      position: relative;
      overflow: hidden;
    }

    video, canvas {
      position: absolute;
      height: 100%;
      width: 100%;
      left: 0;
      top: 0;
      object-fit: contain;
    }
    
    .status-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 5px;
      font-family: sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h2>Back Camera: Manual Focus</h2>
  <div id="container">
    <video id="video" muted autoplay playsinline></video>
    <canvas id="focus-canvas"></canvas>
    <div id="status" class="status-overlay">Initializing...</div>
  </div>

  <script type="text/javascript">
    let track = null;

    window.onload = function() {
      // Automatically attempt to start the camera on load
      startCamera();
      registerEvents();
    };

    async function startCamera() {
      const status = document.getElementById("status");
      
      const constraints = {
        video: {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          // "environment" targets the back camera automatically
          facingMode: { exact: "environment" }
        },
        audio: false
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.getElementById("video");
        video.srcObject = stream;
        
        // Get the video track to apply focus later
        track = stream.getVideoTracks()[0];
        
        status.innerText = "Camera Active: 1920x1080";
        checkCapabilities();
      } catch (error) {
        console.error(error);
        status.innerText = "Error: " + error.message;
        
        // Fallback: If "exact" environment fails (e.g., on a PC), try without "exact"
        if (error.name === "OverconstrainedError" || error.name === "NotFoundError") {
            status.innerText = "Back camera not found. Trying default...";
            const fallbackConstraints = { video: { width: 1920, height: 1080 } };
            const fallbackStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
            document.getElementById("video").srcObject = fallbackStream;
            track = fallbackStream.getVideoTracks()[0];
        }
      }
    }

    function checkCapabilities() {
      if (track) {
        const caps = track.getCapabilities();
        if (!caps.focusMode) {
          console.warn("Focus control not supported on this device.");
        }
      }
    }

    function registerEvents() {
      const container = document.getElementById("container");
      container.addEventListener("click", function(e) {
        // Calculate normalized coordinates (0.0 to 1.0)
        const { offsetX, offsetY } = calculateOffset();
        const x = (e.offsetX - offsetX) / (container.offsetWidth - offsetX * 2);
        const y = (e.offsetY - offsetY) / (container.offsetHeight - offsetY * 2);
        
        // Only trigger if within the video bounds
        if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
            applyManualFocus(x, y);
        }
      });
    }

    async function applyManualFocus(x, y) {
      if (!track) return;

      const video = document.getElementById("video");
      const canvas = document.getElementById("focus-canvas");
      const ctx = canvas.getContext("2d");

      // Draw visual feedback
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.strokeStyle = "cyan";
      ctx.lineWidth = 6;
      ctx.strokeRect(video.videoWidth * x - 40, video.videoHeight * y - 40, 80, 80);

      try {
        const constraints = {
          advanced: [{
            focusMode: "manual",
            pointsOfInterest: [{ x: x, y: y }]
          }]
        };
        await track.applyConstraints(constraints);
      } catch (err) {
        console.error("Focus failed:", err);
      }

      // Clear the box after 1.5 seconds
      setTimeout(() => { canvas.width = canvas.width; }, 1500);
    }

    function calculateOffset() {
      const video = document.getElementById("video");
      let containerWidth = video.offsetWidth;
      let containerHeight = video.offsetHeight;
      let videoWidth = video.videoWidth || 1920;
      let videoHeight = video.videoHeight || 1080;
      
      let containerRatio = containerWidth / containerHeight;
      let videoRatio = videoWidth / videoHeight;
      let offsetX = 0, offsetY = 0;

      if (containerRatio > videoRatio) {
        offsetX = (containerWidth - (containerHeight / videoHeight) * videoWidth) / 2;
      } else {
        offsetY = (containerHeight - (containerWidth / videoWidth) * videoHeight) / 2;
      }
      return { offsetX, offsetY };
    }
  </script>
</body>
</html>
