<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CCTP_Project by Oi Shun - Enhanced Exposure Control</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
  <link rel="stylesheet" href="style2.css">
</head>
<body>

  <h2>CCTP_Project - Enhanced Camera</h2>
  
  <div id="container">
    <video id="video" muted autoplay playsinline></video>
    <canvas id="focus-canvas"></canvas>
    <canvas id="histogram-canvas" style="position:absolute; bottom:10px; left:10px; width:200px; height:80px; background:rgba(0,0,0,0.7); pointer-events:none;"></canvas>
    <div id="status" class="status-overlay">Initializing...</div>
    <div id="brightness-info" style="position:absolute; bottom:10px; right:10px; color:yellow; font-size:12px; pointer-events:none; background:rgba(0,0,0,0.5); padding:5px; border-radius:5px;"></div>
  </div>

  <div class="button-group">
    <button id="capture-btn">📸 Take photo</button>
    <button id="toggle-exposure-btn">🔆 Auto Exposure: OFF</button>
  </div>

  <div class="controls">
    <label style="color:#333; font-size:14px;">Exposure Bias: </label>
    <input type="range" id="exposure-bias" min="-2" max="2" step="0.33" value="0">
    <span id="bias-value" style="margin-left:10px; font-size:14px;">0.0</span>
    <button id="reset-bias" style="margin-left:10px; padding:5px 10px;">Reset</button>
  </div>

  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <script src="sub.js"></script>
</body>
</html>
