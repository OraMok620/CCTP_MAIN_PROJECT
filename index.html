<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>CCTP_Project by Oi Shun</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>CCTP_Project</h2>
  
  <div id="container">
    <video id="video" muted autoplay playsinline></video>
    <canvas id="focus-canvas"></canvas>
    <div id="status" class="status-overlay">Initializing...</div>
    <div id="brightness-info" style="position:absolute; bottom:10px; right:10px; color:yellow; font-size:12px; pointer-events:none;"></div>
  </div>

  <div class="button-group">
    <button id="capture-btn">Take photo</button>
    <button id="toggle-exposure-btn">Auto adjustment</button>
  </div>

  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <script src="main.js"></script>
</body>
</html>
